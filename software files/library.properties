sentence=Library for Boardoza MLX90640 Thermal Camera Array
paragraph=This library provides an easy‑to‑use API for interfacing with the Boardoza MLX90640 32x24 (768 pixel) thermal infrared camera breakout. It handles I²C communication, thermal image acquisition, temperature compensation, and raw frame data extraction. Built on the official Melexis driver, it includes calibration routines, parameter extraction, and support for high-precision thermal imaging applications. With minimal dependencies and clear example sketches, it's designed to help you integrate the MLX90640 quickly into any Arduino or PlatformIO project.
